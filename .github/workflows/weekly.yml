name: Weekly policy check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-policy-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Wait for review replies being applied
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh run list --workflow review-commands.yml --status in_progress --json databaseId -q length)
            [ "$n" = "0" ] && break
            sleep 15
          done
          git pull -q

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_JOURNAL_SEARCHES: ${{ vars.MAX_JOURNAL_SEARCHES }}
        working-directory: pipeline
        run: python run.py

      - name: Apply review replies sent during the run, update the review issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GH_TOKEN: ${{ github.token }}
        working-directory: pipeline
        run: |
          python review_commands.py || echo "review replies could not be applied"
          python github_issue.py --notify

      - name: Commit results
        run: |
          git config user.name "policy-tracker-bot"
          git config user.email "policy-tracker-bot@users.noreply.github.com"
          git add data site/src/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly policy check $(date -u +%Y-%m-%d)"
            git push
          fi
